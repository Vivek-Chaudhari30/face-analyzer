name: FaceScanner
options:
  bundleIdPrefix: com.vivekchaudhari
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  TARGETED_DEVICE_FAMILY: "1"
  GENERATE_INFOPLIST_FILE: YES
targets:
  FaceScanner:
    type: application
    platform: iOS
    sources:
      - FaceScanner
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vivekchaudhari.facescanner
      PRODUCT_NAME: FaceScanner
      INFOPLIST_KEY_CFBundleDisplayName: Face Analyzer
      INFOPLIST_KEY_NSCameraUsageDescription: Face Analyzer uses the front camera to build a 3D face mesh for a cosmetic preview.
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      ENABLE_PREVIEWS: NO
  FaceScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FaceScannerTests
    dependencies:
      - target: FaceScanner
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.vivekchaudhari.facescanner.tests
schemes:
  FaceScanner:
    build:
      targets:
        FaceScanner: all
    test:
      targets:
        - FaceScannerTests
